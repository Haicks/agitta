# Isolated development subset using official Supabase Auth/PostgREST images.
# No public deployment, production SMTP, Storage, Realtime, Studio or Edge runtime.
name: agitta-local
services:
  db:
    image: postgres:17.7-alpine3.23
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run prepare-local-backend.mjs}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    volumes:
      - agitta-db:/var/lib/postgresql/data
      - ../../.tools/supabase-local/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    image: supabase/gotrue:v2.186.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:5173
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:4173,https://localhost
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Run prepare-local-backend.mjs}
      GOTRUE_JWT_ISSUER: http://127.0.0.1:54321/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # Local-only test accounts: no real confirmation messages are delivered.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_RATE_LIMIT_SIGN_IN_SIGN_UPS: 100
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 2s
      timeout: 3s
      retries: 30
  rest:
    image: postgrest/postgrest:v14.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_MAX_ROWS: 1000
  gateway:
    image: kong:2.8.1
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
    ports:
      - "127.0.0.1:54321:8000"
    volumes:
      - ../../.tools/supabase-local/kong.yml:/var/lib/kong/kong.yml:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: cors,key-auth
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_ACCESS_LOG: "off"
volumes:
  agitta-db:
